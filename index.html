<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biceps Compound Eye Fly - 1000 Neuron SNN</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; background: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; -webkit-user-select: none;
        }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0, 0, 0, 0.7); padding: 14px 18px; border-radius: 12px;
            font-size: 13px; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); z-index: 5;
        }
        #ui h2 { margin: 0 0 5px 0; font-size: 16px; color: #a8ffb2; }
        #ui p { margin: 3px 0; }

        /* Kotak Iklan Monetisasi */
        #ad-container {
            position: absolute; bottom: 15px; right: 15px; width: 280px; height: 90px;
            background: #ffffff; border: 2px dashed #ff4444; display: flex;
            align-items: center; justify-content: center; text-align: center;
            color: #333; font-size: 11px; font-weight: bold; z-index: 10; border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        /* Virtual Joystick */
        #joystick-base {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10; backdrop-filter: blur(3px);
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32); border-radius: 50%; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>🪰 Dual Eye Connectome Fly</h2>
        <p>Jaringan Otak: 1.000 Neuron & 899 Koneksi</p>
        <p>Sensor: Mata Majemuk Kiri & Kanan Aktif</p>
        <p>Kontrol: Gunakan Joystick di Kiri</p>
    </div>

    <!-- Kotak Iklan -->
    <div id="ad-container">
        [ Tempat Script Iklan Adsterra / AdSense ]
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Load Three.js & GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. SETUP LINGKUNGAN KEBUN & LANGIT BIRU
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(30, 50, 20);
        scene.add(sunLight);

        // Tanah Rumput & Pohon Kebun
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Kumpulan Pohon sebagai rintangan di kebun
        const trees = [];
        for (let i = 0; i < 20; i++) {
            const tree = new THREE.Mesh(
                new THREE.ConeGeometry(2.5, 7, 5),
                new THREE.MeshStandardMaterial({ color: 0x234e30 })
            );
            let x = (Math.random() - 0.5) * 90;
            let z = (Math.random() - 0.5) * 90;
            if (Math.abs(x) > 10 || Math.abs(z) > 10) {
                tree.position.set(x, 3.5, z);
                scene.add(tree);
                trees.push(tree.position);
            }
        }

        // 2. MODEL LALAT & PEMUAT .GLB
        const flyGroup = new THREE.Group();
        scene.add(flyGroup);

        const fallbackFly = new THREE.Group();
        const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
        const abdomen = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 0.45, 8), new THREE.MeshStandardMaterial({ color: 0x4a3b2c }));
        abdomen.rotation.x = Math.PI / 2; abdomen.position.set(0, 0, -0.35);
        fallbackFly.add(thorax); fallbackFly.add(abdomen);
        flyGroup.add(fallbackFly);

        const loader = new THREE.GLTFLoader();
        loader.load('lalat.glb', (gltf) => {
            flyGroup.remove(fallbackFly);
            const customModel = gltf.scene;
            customModel.scale.set(0.6, 0.6, 0.6);
            customModel.position.set(0, -0.2, 0);
            flyGroup.add(customModel);
        });

        // 3. OTAK SNN: 1.000 NEURON & 899 KONEKSI DENGAN INPUT MATA KIRI & KANAN
        class DualEyeFlyBrain {
            constructor(numNeurons = 1000, numConnections = 899) {
                this.neurons = [];
                for (let i = 0; i < numNeurons; i++) {
                    this.neurons.push({
                        voltage: Math.random() * 0.2,
                        threshold: 0.85 + Math.random() * 0.4,
                        leak: 0.82,
                        output: 0
                    });
                }

                // 899 Koneksi sinapsis terarah antar neuron
                this.synapses = [];
                for (let c = 0; c < numConnections; c++) {
                    this.synapses.push({
                        from: Math.floor(Math.random() * numNeurons),
                        to: Math.floor(Math.random() * numNeurons),
                        weight: (Math.random() - 0.4) * 0.35
                    });
                }
            }

            step(leftEyeInput, rightEyeInput) {
                // Neuron ke-0 diisi input dari Mata Kiri, Neuron ke-1 dari Mata Kanan
                this.neurons[0].voltage += leftEyeInput * 2.0;
                this.neurons[1].voltage += rightEyeInput * 2.0;

                // Dorongan internal eksplorasi konstan (rasa lapar/ingin jalan)
                this.neurons[2].voltage += 1.2;

                // Propagasi sinyal listrik melintasi 899 koneksi sinapsis
                for (let s of this.synapses) {
                    if (this.neurons[s.from].output > 0) {
                        this.neurons[s.to].voltage += s.weight;
                    }
                }

                // Kalkulasi Leaky Integrate-and-Fire untuk 1.000 neuron
                for (let n of this.neurons) {
                    n.voltage *= n.leak;
                    if (n.voltage >= n.threshold) {
                        n.output = 1.0;
                        n.voltage = 0.0;
                    } else {
                        n.output = 0.0;
                    }
                }

                // Ambil keputusan motorik dari neuron akhir (900 - 999)
                let motorForward = 0, motorTurn = 0, motorLift = 0;
                for (let i = 900; i < this.neurons.length; i++) {
                    if (i % 3 === 0) motorForward += this.neurons[i].output;
                    else if (i % 3 === 1) motorTurn += this.neurons[i].output;
                    else motorLift += this.neurons[i].output;
                }

                return {
                    forward: 0.16 + (motorForward * 0.05),
                    turn: (motorTurn - 1.5) * 0.045,
                    lift: (motorLift - 1.5) * 0.025
                };
            }
        }

        const brain = new DualEyeFlyBrain(1000, 899);

        // 4. POSISI & KONTROL JOYSTICK
        let flyPos = new THREE.Vector3(0, 3, 0);
        let flyRotY = 0;
        let cameraAngleX = 0, cameraAngleY = 0;
        let smoothTurn = 0, smoothLift = 0, smoothForward = 0.16;

        let joystickMove = { x: 0, y: 0 };
        const stick = document.getElementById('joystick-stick');
        const base = document.getElementById('joystick-base');

        base.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = base.getBoundingClientRect();
            let x = touch.clientX - (rect.left + rect.width / 2);
            let y = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.sqrt(x*x + y*y);
            const maxDist = 40;
            if (dist > maxDist) { x = (x / dist) * maxDist; y = (y / dist) * maxDist; }
            stick.style.transform = `translate(${x}px, ${y}px)`;
            joystickMove.x = x / maxDist;
            joystickMove.y = y / maxDist;
        });

        base.addEventListener('touchend', () => {
            stick.style.transform = `translate(0px, 0px)`;
            joystickMove.x = 0; joystickMove.y = 0;
        });

        // 5. LOOP UTAMA ANIMASI & SENSOR MATA MAJEMUK
        function animate() {
            requestAnimationFrame(animate);

            // Simulasi Mata Majemuk: Mendeteksi arah pandangan kiri & kanan terhadap batas/pohon
            let leftEyeSignal = 0.05;
            let rightEyeSignal = 0.05;

            // Cek jarak terhadap dinding batas kebun di sisi kiri-kanan pandangan lalat
            let leftCheckX = flyPos.x - Math.cos(flyRotY) * 3;
            let leftCheckZ = flyPos.z + Math.sin(flyRotY) * 3;
            let rightCheckX = flyPos.x + Math.cos(flyRotY) * 3;
            let rightCheckZ = flyPos.z - Math.sin(flyRotY) * 3;

            if (Math.abs(leftCheckX) > 42 || Math.abs(leftCheckZ) > 42) leftEyeSignal = 1.8;
            if (Math.abs(rightCheckX) > 42 || Math.abs(rightCheckZ) > 42) rightEyeSignal = 1.8;

            // Proses berpikir lewat otak SNN menggunakan input mata kiri dan kanan
            let brainOutput = brain.step(leftEyeSignal, rightEyeSignal);

            // Penghalusan gerakan agar lalat tidak getar dan terbang natural
            smoothForward = THREE.MathUtils.lerp(smoothForward, brainOutput.forward, 0.1);
            smoothTurn = THREE.MathUtils.lerp(smoothTurn, brainOutput.turn + (rightEyeSignal - leftEyeSignal) * 0.04, 0.1);
            smoothLift = THREE.MathUtils.lerp(smoothLift, brainOutput.lift, 0.1);

            flyRotY += smoothTurn;
            flyPos.x -= Math.sin(flyRotY) * smoothForward;
            flyPos.z -= Math.cos(flyRotY) * smoothForward;
            flyPos.y += smoothLift;

            // Batasi ketinggian terbang
            flyPos.y = Math.max(1.2, Math.min(10, flyPos.y));

            flyGroup.position.copy(flyPos);
            flyGroup.rotation.y = flyRotY;

            // Kontrol Kamera lewat Joystick
            cameraAngleY -= joystickMove.x * 0.03;
            cameraAngleX += joystickMove.y * 0.02;
            cameraAngleX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraAngleX));

            let camDist = 6.0;
            camera.position.x = flyPos.x + Math.sin(flyRotY + cameraAngleY) * camDist;
            camera.position.z = flyPos.z + Math.cos(flyRotY + cameraAngleY) * camDist;
            camera.position.y = flyPos.y + 2.0 + cameraAngleX * 2.5;
            camera.lookAt(flyPos.x, flyPos.y + 0.3, flyPos.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
    </html>
