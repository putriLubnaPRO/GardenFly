<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN Fly Brain 3D Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        #hud-info {
            position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75);
            padding: 12px 16px; border-radius: 8px; border: 1px solid #00ffcc;
            font-size: 12px; pointer-events: none; max-width: 280px;
        }
        #hud-info h3 { margin: 0 0 6px 0; color: #00ffcc; font-size: 14px; }

        #hud-stats {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.75);
            padding: 12px 16px; border-radius: 8px; border: 1px solid #ff007f;
            font-size: 11px; pointer-events: none; text-align: right;
        }
        
        #mini-brain-container {
            position: absolute; bottom: 15px; right: 15px; width: 120px; height: 120px;
            border: 1px solid #00ffcc; border-radius: 8px; background: rgba(0,0,0,0.5); overflow: hidden;
        }

        #joystick-base {
            position: absolute; bottom: 30px; left: 30px; width: 80px; height: 80px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; touch-action: none;
        }
        #joystick-stick {
            position: absolute; top: 20px; left: 20px; width: 40px; height: 40px;
            background: #00ffcc; border-radius: 50%; transition: transform 0.05s ease-out;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud-info">
        <h3>SNN FLY BRAIN (19.000 NEURON)</h3>
        <div><strong id="hud-action-title">INITIALIZING...</strong></div>
        <div id="hud-action-desc" style="color:#aaa; margin-top:4px;">Loading CPG circuit...</div>
    </div>

    <div id="hud-stats">
        <div>CNS Rhythm: <span id="hud-cns-rhythm" style="color:#00ffcc">Active</span></div>
        <div>Dopamine: <span id="hud-dopamine" style="color:#ffcc00">50%</span></div>
        <div>Firing Rate: <span id="hud-firing" style="color:#00ffcc">1.4 kHz</span></div>
        <div>Spike Mode: <span id="hud-spike" style="color:#ff007f">Active</span></div>
        <div>Synapses: <span id="hud-syn-stat" style="color:#00ffcc">40k Syn</span></div>
        <div>Active Neurons: <span id="active-neurons-text" style="color:#00ffcc">11.800 / 19K</span></div>
    </div>

    <div id="mini-brain-container"></div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050510);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const mapSize = 40;
        const gridHelper = new THREE.GridHelper(mapSize * 2, 40, 0x00ffcc, 0x222244);
        scene.add(gridHelper);

        const obstacles = [];
        let flowerGroup = null;

        for (let i = 0; i < 12; i++) {
            const geo = new THREE.CylinderGeometry(0.5, 0.8, 4, 8);
            const mat = new THREE.MeshLambertMaterial({ color: 0x335577 });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set((Math.random() - 0.5) * 60, 2, (Math.random() - 0.5) * 60);
            scene.add(obs);
            obstacles.push(obs);
        }

        for (let i = 0; i < 6; i++) {
            const flower = new THREE.Group();
            const stemMat = new THREE.MeshBasicMaterial({ color: 0x00ff55 });
            const petalMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
            
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), stemMat);
            stem.position.y = 0.5;
            const petal = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), petalMat);
            petal.position.y = 1.0;
            
            flower.add(stem);
            flower.add(petal);
            flower.position.set((Math.random() - 0.5) * 50, 0, (Math.random() - 0.5) * 50);
            scene.add(flower);
            if (!flowerGroup) flowerGroup = flower;
        }

        const flyGroup = new THREE.Group();
        const flyBodyGeo = new THREE.ConeGeometry(0.2, 0.6, 6);
        flyBodyGeo.rotateX(Math.PI / 2);
        const flyMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        const flyMesh = new THREE.Mesh(flyBodyGeo, flyMat);
        flyGroup.add(flyMesh);
        scene.add(flyGroup);

        const miniContainer = document.getElementById('mini-brain-container');
        const miniScene = new THREE.Scene();
        const miniCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        miniCamera.position.z = 3;

        const miniRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        miniRenderer.setSize(120, 120);
        miniContainer.appendChild(miniRenderer.domElement);

        const miniBrainGroup = new THREE.Group();
        const numParticles = 120;
        const miniNeuronGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(numParticles * 3);
        const colors = new Float32Array(numParticles * 3);

        for (let i = 0; i < numParticles * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 1.8;
            positions[i + 1] = (Math.random() - 0.5) * 1.8;
            positions[i + 2] = (Math.random() - 0.5) * 1.8;
            colors[i] = 0.1; colors[i + 1] = 0.8; colors[i + 2] = 1.0;
        }

        miniNeuronGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        miniNeuronGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const miniNeuronMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true });
        const miniPoints = new THREE.Points(miniNeuronGeo, miniNeuronMat);
        miniBrainGroup.add(miniPoints);
        miniScene.add(miniBrainGroup);
                class SNNFlyBrain {
            constructor() { 
                this.time = 0; 
                this.energy = 100; 
                this.cpgInhibitory = 0.0;
                this.cpgExcitatory1 = 0.5;
                this.cpgExcitatory2 = 0.5;
            }

            stepCPG(driveSignal) {
                let dt = 0.15;
                let inhibInput = this.cpgExcitatory1 - this.cpgExcitatory2;
                this.cpgInhibitory += dt * (-this.cpgInhibitory + Math.max(0, inhibInput));
                
                let exc1Input = driveSignal - this.cpgInhibitory + Math.sin(this.time * 0.15);
                let exc2Input = driveSignal + this.cpgInhibitory - Math.cos(this.time * 0.15);

                this.cpgExcitatory1 += dt * (-this.cpgExcitatory1 + Math.max(0, exc1Input));
                this.cpgExcitatory2 += dt * (-this.cpgExcitatory2 + Math.max(0, exc2Input));

                return Math.sin(this.time * 0.4) * (this.cpgExcitatory1 * 0.05 + 0.02);
            }

            step(eyeLeft, eyeFront, eyeRight, isPerching) {
                this.time++;
                
                if (isPerching) {
                    this.energy = Math.min(100, this.energy + 0.35); 
                    let cpgVal = this.stepCPG(0.1); 
                    return { forward: 0, turn: 0, lift: cpgVal * 0.1, title: "PERCHING (RESTING)", desc: "cpg rhythm resting, energy recovering", dop: "15%", firing: "0.2 kHz", spike: "Resting", synStat: "Paused", activeNeurons: 3200, cpgState: "Low/Rest" };
                } else {
                    this.energy = Math.max(0, this.energy - 0.04); 
                }

                if (eyeFront > 0.3) {
                    let cpgVal = this.stepCPG(1.5); 
                    return { forward: 0.10, turn: (eyeRight > eyeLeft ? -0.05 : 0.05), lift: cpgVal, title: "EMERGENCY AVOIDANCE", desc: "dng100 & cpg circuit trigger escape", dop: "72%", firing: "3.8 kHz", spike: "Burst!", synStat: "Active Burst", activeNeurons: 17450, cpgState: "Active (Escape)" };
                } else if (eyeFront > 0.12 || eyeLeft > 0.25 || eyeRight > 0.25) {
                    let cpgVal = this.stepCPG(0.8);
                    return { forward: 0.10, turn: (eyeRight - eyeLeft) * 0.06, lift: cpgVal, title: "OBSTACLE STEERING", desc: "cpg modulation adjusts vector", dop: "58%", firing: "2.2 kHz", spike: "Steering", synStat: "40k Syn", activeNeurons: 14200, cpgState: "Active (Steer)" };
                } else {
                    let cpgVal = this.stepCPG(0.5); 
                    return { forward: 0.10, turn: Math.sin(this.time * 0.04) * 0.015, lift: cpgVal, title: "AUTONOMOUS FLIGHT", desc: "cpg 3-neuron rhythmic active", dop: "54%", firing: "1.4 kHz", spike: "Active", synStat: "40k Syn", activeNeurons: 11800, cpgState: "Active (Stable)" };
                }
            }
        }

        const brain = new SNNFlyBrain();
        let posX = 0, posY = 1.4, posZ = 0, rotY = 0, smoothTurn = 0;
        let camAngleOffsetH = 0, camAngleOffsetV = 0, camDist = 4.5;
        let joystickMove = { x: 0, y: 0 };

        let perchingTimer = 0;
        let isPerching = false;
        let perchState = 'flying'; 

        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');

        function updateJoystick(cx, cy) {
            const rect = base.getBoundingClientRect();
            let x = cx - (rect.left + rect.width / 2);
            let y = cy - (rect.top + rect.height / 2);
            let dist = Math.sqrt(x*x + y*y), max = 40;
            if (dist > max) { x = (x/dist)*max; y = (y/dist)*max; }
            stick.style.transform = `translate(${x}px, ${y}px)`;
            joystickMove.x = x / max; 
            joystickMove.y = y / max; 
        }

        base.addEventListener('touchmove', e => updateJoystick(e.touches[0].clientX, e.touches[0].clientY));
        base.addEventListener('touchend', () => { stick.style.transform = `translate(0px, 0px)`; joystickMove.x = 0; joystickMove.y = 0; });
        let isDown = false;
        base.addEventListener('mousedown', () => isDown = true);
        window.addEventListener('mousemove', e => { if (isDown) updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (isDown) { isDown = false; stick.style.transform = `translate(0px, 0px)`; joystickMove.x = 0; joystickMove.y = 0; } });

        function animate() {
            requestAnimationFrame(animate);

            let flyPos = new THREE.Vector3(posX, posY, posZ);
            let flyDir = new THREE.Vector3(-Math.sin(rotY), 0, -Math.cos(rotY));
            let eyeLeft = 0, eyeFront = 0, eyeRight = 0, lookRange = 4.0;

            if (perchState === 'flying' && brain.energy <= 5) {
                let nearObj = obstacles.find(obs => flyPos.distanceTo(obs.position) < 4.0);
                if (nearObj) {
                    perchState = 'landing';
                    perchingTimer = Math.floor(Math.random() * 480) + 240; 
                }
            }

            if (perchState === 'landing') {
                posY = THREE.MathUtils.lerp(posY, 0.2, 0.05); 
                if (posY <= 0.25) {
                    posY = 0.2;
                    perchState = 'perched';
                    isPerching = true;
                }
            } else if (perchState === 'perched') {
                perchingTimer--;
                flyGroup.rotation.z = Math.sin(Date.now() * 0.02) * 0.08;

                if (perchingTimer <= 0 || brain.energy >= 95 || Math.abs(joystickMove.x) > 0.1 || Math.abs(joystickMove.y) > 0.1) {
                    perchState = 'takeoff';
                    isPerching = false;
                    flyGroup.rotation.z = 0; 
                }
            } else if (perchState === 'takeoff') {
                posY = THREE.MathUtils.lerp(posY, 1.4, 0.04); 
                if (posY >= 1.35) {
                    posY = 1.4;
                    perchState = 'flying';
                }
            }

            obstacles.forEach(obs => {
                let obsPos = new THREE.Vector3(obs.position.x, posY, obs.position.z);
                let d = flyPos.distanceTo(obsPos);
                if (d < lookRange) {
                    let dir = new THREE.Vector3().subVectors(obsPos, flyPos).normalize();
                    let cross = flyDir.clone().cross(dir).y;
                    let dot = flyDir.clone().dot(dir);
                    if (dot > 0.1) eyeFront += (lookRange - d) * 0.15;
                    if (cross > 0) eyeRight += (lookRange - d) * 0.15;
                    else eyeLeft += (lookRange - d) * 0.15;
                }
            });

            if (perchState === 'flying' && eyeFront < 0.1 && flowerGroup) {
                let nearestFlower = null, minDist = 15.0;
                scene.traverse(child => {
                    if (child.type === "Group" && child.children.length === 2 && child.position.y === 0) {
                        let d = flyPos.distanceTo(child.position);
                        if (d < minDist) { minDist = d; nearestFlower = child; }
                    }
                });
                if (nearestFlower) {
                    let flowerDir = new THREE.Vector3().subVectors(nearestFlower.position, flyPos).normalize();
                    let cross = flyDir.clone().cross(flowerDir).y;
                    rotY += cross * 0.012; 
                }
            }

            if (posX > (mapSize - 5)) eyeRight += (mapSize - posX) * 0.15;
            if (posX < (-mapSize + 5)) eyeLeft += (posX - (-mapSize)) * 0.15;
            if (posZ > (mapSize - 5)) eyeFront += (mapSize - posZ) * 0.15;
            if (posZ < (-mapSize + 5)) eyeFront += (posZ - (-mapSize)) * 0.15;

            let brainOut = brain.step(eyeLeft, eyeFront, eyeRight, isPerching);

            document.getElementById('hud-action-title').innerText = isPerching ? "GROOMING & RESTING" : brainOut.title;
            document.getElementById('hud-action-desc').innerText = (isPerching ? "cleaning legs & resting" : brainOut.desc) + ` (Energy: ${Math.round(brain.energy)}%)`;
            document.getElementById('hud-cns-rhythm').innerText = brainOut.cpgState;
            document.getElementById('hud-dopamine').innerText = brainOut.dop;
            document.getElementById('hud-firing').innerText = brainOut.firing;
            document.getElementById('hud-spike').innerText = brainOut.spike;
            document.getElementById('hud-syn-stat').innerText = brainOut.synStat;
            document.getElementById('active-neurons-text').innerText = brainOut.activeNeurons.toLocaleString('id-ID') + " / 19K";

            miniBrainGroup.rotation.y += 0.015;
            let colAttr = miniNeuronGeo.attributes.color;
            for(let i = 0; i < colAttr.count; i++) {
                let w = Math.sin(Date.now() * 0.012 + i);
                if (brainOut.spike === "Resting") {
                    colAttr.setXYZ(i, 0.2, 0.2, 0.4); 
                } else if (brainOut.spike === "Burst!") {
                    colAttr.setXYZ(i, 1.0, 0.2 + Math.abs(w)*0.8, 0.0);
                } else if (brainOut.spike === "Steering") {
                    colAttr.setXYZ(i, 0.1, 1.0, 0.5);
                } else {
                    colAttr.setXYZ(i, 0.1, 0.8 + w * 0.2, 1.0);
                }
            }
            colAttr.needsUpdate = true;

            if (perchState === 'flying') {
                smoothTurn = THREE.MathUtils.lerp(smoothTurn, brainOut.turn, 0.08);
                rotY += smoothTurn;

                posX -= Math.sin(rotY) * brainOut.forward;
                posZ -= Math.cos(rotY) * brainOut.forward;

                posX = Math.max(-39.5, Math.min(39.5, posX));
                posZ = Math.max(-39.5, Math.min(39.5, posZ));
                
                posY += brainOut.lift;
                if (posY < 1.0) posY = 1.0;
                if (posY > 2.8) posY = 2.8;
            }

            flyGroup.position.set(posX, posY, posZ);
            flyGroup.rotation.y = rotY;

            camAngleOffsetH += joystickMove.x * 0.03;
            camAngleOffsetV = THREE.MathUtils.lerp(camAngleOffsetV, -joystickMove.y * 2.0, 0.1);

            let totalCamAngle = rotY + Math.PI + camAngleOffsetH;
            camera.position.set(
                posX + Math.sin(totalCamAngle) * camDist,
                posY + 1.0 + camAngleOffsetV,
                posZ + Math.cos(totalCamAngle) * camDist
            );
            camera.lookAt(posX, posY + 0.2, posZ);

            renderer.render(scene, camera);
            miniRenderer.render(miniScene, miniCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
