<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Amazing Digital Fly - 3D Neural HUD</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; user-select: none; }
        #info {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(0,0,0,0.75); padding: 10px 14px; border-radius: 8px; font-size: 12px;
            z-index: 5; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.3); pointer-events: none;
        }
        #info h3 { margin: 0 0 4px 0; color: #a8ffb2; font-size: 13px; }
        #info p { margin: 2px 0; }
        .neuron-glow { color: #ffeb3b; font-weight: bold; }
        .synapse-glow { color: #ff4081; font-weight: bold; }

        #cns-hud {
            position: absolute; top: 15px; right: 15px; width: 270px;
            background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 8px; padding: 8px; color: #fff; z-index: 5;
            backdrop-filter: blur(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); pointer-events: none; font-family: monospace;
        }
        .cns-header {
            font-size: 9px; color: #00e5ff; letter-spacing: 1px; font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 3px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        #mini-brain-container {
            width: 100%; height: 100px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 5px; margin-bottom: 5px;
            position: relative; overflow: hidden;
        }
        #mini-brain-canvas { width: 100%; height: 100%; display: block; }

        .cns-status-box {
            background: rgba(0, 229, 255, 0.1); border-left: 3px solid #00e5ff;
            padding: 4px 6px; margin-bottom: 5px; border-radius: 0 3px 3px 0;
        }
        .cns-status-title { font-size: 10px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .cns-status-desc { font-size: 8px; color: #a8ffb2; margin-top: 1px; }
        
        .cns-metrics { 
            font-size: 8px; color: #aaa; display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;
        }
        .cns-metrics span { color: #ffeb3b; font-weight: bold; }

        #ad-box {
            position: absolute; bottom: 15px; right: 15px; width: 270px; height: 65px;
            background: #fff; border: 2px dashed #ff4444; display: flex; 
            align-items: center; justify-content: center; text-align: center; font-weight: bold; 
            color: #333; font-size: 9px; z-index: 10; border-radius: 6px;
        }
        #joystick-base {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10; backdrop-filter: blur(3px);
        }
        #joystick-stick {
            position: absolute; top: 32px; left: 32px; width: 42px; height: 42px;
            background: linear-gradient(135deg, #00BCD4, #009688); border-radius: 50%; pointer-events: none;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>

    <div id="info">
        <h3>🪰 Digital Fly SNN</h3>
        <p>Neuron: <span class="neuron-glow">19.000</span></p>
        <p>Sinapsis: <span class="synapse-glow">40.000</span></p>
    </div>

    <div id="cns-hud">
        <div class="cns-header">
            <span>FLY BRAIN - CNS LIVE</span>
            <span style="color: #00ffcc;">● LIVE</span>
        </div>
        
        <div id="mini-brain-container">
            <canvas id="mini-brain-canvas"></canvas>
        </div>

        <div class="cns-status-box">
            <div id="hud-action-title" class="cns-status-title">AUTONOMOUS FLIGHT</div>
            <div id="hud-action-desc" class="cns-status-desc">descending neurons drive course</div>
        </div>
        
        <div class="cns-metrics">
            <div>Firing Rate: <span id="hud-firing">1.4 kHz</span></div>
            <div>Dopamine: <span id="hud-dopamine">54%</span></div>
            <div>Spike Act: <span id="hud-spike">Active</span></div>
            <div>Spike Syn: <span id="hud-syn-stat">40k Syn</span></div>
        </div>
    </div>

    <div id="ad-box"><script>
  atOptions = {
    'key' : '1906564690a0b056148af87aadb9bbd4',
    'format' : 'iframe',
    'height' : 90,
    'width' : 728,
    'params' : {}
  };
</script>
<script src="https://www.highrevenueformat.com/1906564690a0b056148af87aadb9bbd4/invoke.js"></script>
    </div>
    <div id="joystick-base"><div id="joystick-stick"></div></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(30, 50, 20);
        scene.add(sunLight);

        // MINI 3D NEURON & KONEKSI DI HUD KANAN ATAS
        const miniContainer = document.getElementById('mini-brain-container');
        const miniCanvas = document.getElementById('mini-brain-canvas');
        const miniRenderer = new THREE.WebGLRenderer({ canvas: miniCanvas, antialias: true, alpha: true });
        miniRenderer.setSize(miniContainer.clientWidth, miniContainer.clientHeight);

        const miniScene = new THREE.Scene();
        const miniCamera = new THREE.PerspectiveCamera(50, miniContainer.clientWidth / miniContainer.clientHeight, 0.1, 100);
        miniCamera.position.set(0, 0, 3.0);

        const miniBrainGroup = new THREE.Group();
        miniScene.add(miniBrainGroup);

        const neuronGeo = new THREE.BufferGeometry();
        const nCounts = 70;
        const positions = new Float32Array(nCounts * 3);
        const colors = new Float32Array(nCounts * 3);

        for(let i = 0; i < nCounts * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 1.6;
            positions[i+1] = (Math.random() - 0.5) * 1.1;
            positions[i+2] = (Math.random() - 0.5) * 0.9;
            colors[i] = 0; colors[i+1] = 0.9; colors[i+2] = 1.0;
        }
        neuronGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        neuronGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const neuronPoints = new THREE.Points(neuronGeo, new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.95 }));
        miniBrainGroup.add(neuronPoints);

        const synGeo = new THREE.BufferGeometry();
        const synPos = new Float32Array(140);
        for(let i = 0; i < 140; i += 3) {
            synPos[i] = (Math.random() - 0.5) * 1.5;
            synPos[i+1] = (Math.random() - 0.5) * 1.0;
            synPos[i+2] = (Math.random() - 0.5) * 0.8;
        }
        synGeo.setAttribute('position', new THREE.BufferAttribute(synPos, 3));
        const synLines = new THREE.LineSegments(synGeo, new THREE.LineBasicMaterial({ color: 0xff4081, transparent: true, opacity: 0.6 }));
        miniBrainGroup.add(synLines);

        // DUNIA UTAMA
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const mapSize = 42;
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
        const wallNorth = new THREE.Mesh(new THREE.PlaneGeometry(mapSize * 2, 5), wallMat); wallNorth.position.set(0, 2.5, mapSize);
        const wallSouth = new THREE.Mesh(new THREE.PlaneGeometry(mapSize * 2, 5), wallMat); wallSouth.position.set(0, 2.5, -mapSize); wallSouth.rotation.y = Math.PI;
        const wallEast = new THREE.Mesh(new THREE.PlaneGeometry(mapSize * 2, 5), wallMat); wallEast.position.set(mapSize, 2.5, 0); wallEast.rotation.y = -Math.PI / 2;
        const wallWest = new THREE.Mesh(new THREE.PlaneGeometry(mapSize * 2, 5), wallMat); wallWest.position.set(-mapSize, 2.5, 0); wallWest.rotation.y = Math.PI / 2;
        scene.add(wallNorth, wallSouth, wallEast, wallWest);

        const obstacles = [];
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.8 });
        for (let i = 0; i < 12; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 3, 10), trunkMat); trunk.position.y = 1.5;
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 12), leavesMat); leaves.position.y = 4.0;
            tree.add(trunk, leaves);
            let x = (Math.random() - 0.5) * 55, z = (Math.random() - 0.5) * 55;
            if (Math.abs(x) > 8 || Math.abs(z) > 8) { tree.position.set(x, 0, z); scene.add(tree); obstacles.push(tree); }
        }

        const flyGroup = new THREE.Group();
        scene.add(flyGroup);
        const fallbackFly = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0x222 }));
        flyGroup.add(fallbackFly);

        new THREE.GLTFLoader().load('lalat.glb', (gltf) => {
            flyGroup.remove(fallbackFly);
            gltf.scene.scale.set(0.5, 0.5, 0.5);
            gltf.scene.position.set(0, -0.1, 0);
            flyGroup.add(gltf.scene);
        });

        class SNNFlyBrain {
            constructor() { this.time = 0; }
            step(eyeFront, eyeLeft, eyeRight) {
                this.time++;
                if (eyeFront > 0.3) {
                    return { turn: (eyeRight > eyeLeft ? -0.04 : 0.04), forward: 0.11, lift: 0.005, title: "EMERGENCY AVOIDANCE", desc: "optic lobes trigger sharp turn", dop: "72%", firing: "3.8 kHz", spike: "Burst!", synStat: "Firing Active" };
                } else if (eyeFront > 0.12 || eyeLeft > 0.25 || eyeRight > 0.25) {
                    return { turn: (eyeRight - eyeLeft) * 0.05, forward: 0.11, lift: 0.004, title: "OBSTACLE STEERING", desc: "mushroom bodies adjust vector", dop: "58%", firing: "2.2 kHz", spike: "Steering", synStat: "40k Syn" };
                } else {
                    return { turn: Math.sin(this.time * 0.04) * 0.015, forward: 0.11, lift: Math.sin(this.time * 0.06) * 0.008, title: "AUTONOMOUS FLIGHT", desc: "descending neurons drive course", dop: "54%", firing: "1.4 kHz", spike: "Active", synStat: "40k Syn" };
                }
            }
        }

        const brain = new SNNFlyBrain();
        let posX = 0, posY = 2.0, posZ = 0, rotY = 0, smoothTurn = 0;
        let joystickMove = { x: 0, y: 0 };

        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');

        function updateJoystick(cx, cy) {
            const rect = base.getBoundingClientRect();
            let x = cx - (rect.left + rect.width / 2), y = cy - (rect.top + rect.height / 2);
            let dist = Math.sqrt(x*x + y*y), max = 35;
            if (dist > max) { x = (x/dist)*max; y = (y/dist)*max; }
            stick.style.transform = `translate(${x}px, ${y}px)`;
            joystickMove.x = x / max; joystickMove.y = y / max;
        }

        base.addEventListener('touchmove', e => updateJoystick(e.touches[0].clientX, e.touches[0].clientY));
        base.addEventListener('touchend', () => { stick.style.transform = `translate(0px, 0px)`; joystickMove.x = 0; joystickMove.y = 0; });
        let isDown = false;
        base.addEventListener('mousedown', () => isDown = true);
        window.addEventListener('mousemove', e => { if (isDown) updateJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (isDown) { isDown = false; stick.style.transform = `translate(0px, 0px)`; joystickMove.x = 0; joystickMove.y = 0; } });

        function animate() {
            requestAnimationFrame(animate);

            let flyPos = new THREE.Vector3(posX, posY, posZ);
            let flyDir = new THREE.Vector3(-Math.sin(rotY), 0, -Math.cos(rotY));
            let eyeLeft = 0, eyeFront = 0, eyeRight = 0, lookRange = 4.0;

            obstacles.forEach(obs => {
                let obsPos = new THREE.Vector3(obs.position.x, posY, obs.position.z);
                let d = flyPos.distanceTo(obsPos);
                if (d < lookRange) {
                    let dir = new THREE.Vector3().subVectors(obsPos, flyPos).normalize();
                    let cross = flyDir.clone().cross(dir).y;
                    let dot = flyDir.clone().dot(dir);
                    if (dot > 0.1) eyeFront += (lookRange - d) * 0.15;
                    if (cross > 0) eyeRight += (lookRange - d) * 0.15;
                    else eyeLeft += (lookRange - d) * 0.15;
                }
            });

            let brainOut = brain.step(eyeFront, eyeLeft, eyeRight);

            // Update Teks HUD
            document.getElementById('hud-action-title').innerText = brainOut.title;
            document.getElementById('hud-action-desc').innerText = brainOut.desc;
            document.getElementById('hud-dopamine').innerText = brainOut.dop;
            document.getElementById('hud-firing').innerText = brainOut.firing;
            document.getElementById('hud-spike').innerText = brainOut.spike;
            document.getElementById('hud-syn-stat').innerText = brainOut.synStat;

            // Animasi Warna Neuron 3D Mini Sesuai Status Firing Otak
            miniBrainGroup.rotation.y += 0.015;
            let colAttr = neuronGeo.attributes.color;
            for(let i = 0; i < colAttr.count; i++) {
                let w = Math.sin(Date.now() * 0.012 + i);
                if (brainOut.spike === "Burst!") {
                    colAttr.setXYZ(i, 1.0, 0.1 + Math.abs(w)*0.9, 0.0); // Nyala merah/kuning terang
                } else if (brainOut.spike === "Steering") {
                    colAttr.setXYZ(i, 0.1, 1.0, 0.4); // Hijau/Cyan
                } else {
                    colAttr.setXYZ(i, 0.0, 0.7 + w * 0.3, 1.0); // Biru stabil
                }
            }
            colAttr.needsUpdate = true;

            smoothTurn = THREE.MathUtils.lerp(smoothTurn, brainOut.turn, 0.08);
            rotY += smoothTurn;
            posX -= Math.sin(rotY) * brainOut.forward;
            posZ -= Math.cos(rotY) * brainOut.forward;

            // Batas Map
            posX = Math.max(-40, Math.min(40, posX));
            posZ = Math.max(-40, Math.min(40, posZ));

            flyGroup.position.set(posX, posY, posZ);
            flyGroup.rotation.y = rotY;

            let camAngle = rotY + Math.PI + (joystickMove.x * 0.03);
            camera.position.set(posX + Math.sin(camAngle) * 4.5, posY + 1.2, posZ + Math.cos(camAngle) * 4.5);
            camera.lookAt(posX, posY + 0.2, posZ);

            renderer.render(scene, camera);
            miniRenderer.render(miniScene, miniCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <script src="https://pl31655377.profitableratecpmnetwork.com/c6/d7/62/c6d7626fce1b5f1670359b8e1c8f1ff1.js"></script>
